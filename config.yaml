# folders and paths
data_folder: "data"
nn_folder: "models"

# Environment
bounds:
      - -3.0
      - 3.0
      - -3.0
      - 3.0

# Dataset Generation
num_samples: 10000
version: 1

# Neural Network
learning_rate: 100 # will be used as 1/lr in the code
epochs: 200

# MPC
horizon_length: 8
terminal_cost_type: "nn" # "nn" or "heuristic"
start: [2.0, 1.5]
goal: [0.0, 1.0]
Q: [0.01, 0.001]
R: [0.001, 0.001]
W: 0.001






